services:
  frontend:
    build: ./frontend
    ports: ["80:80"]
    depends_on: [backend]
    restart: unless-stopped

  backend:
    build: ./backend/ChessPlatform.Api
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=chessplatform;Username=chess;Password=${DB_PASSWORD}
      - Auth__Google__ClientId=${GOOGLE_CLIENT_ID}
      - Auth__Google__ClientSecret=${GOOGLE_CLIENT_SECRET}
      - Auth__GitHub__ClientId=${GITHUB_CLIENT_ID}
      - Auth__GitHub__ClientSecret=${GITHUB_CLIENT_SECRET}
      - Auth__Jwt__Secret=${JWT_SECRET}
      - Auth__FrontendUrl=${FRONTEND_URL:-http://localhost}
      - ASPNETCORE_ENVIRONMENT=Production
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chessplatform
      POSTGRES_USER: chess
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chess -d chessplatform"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
